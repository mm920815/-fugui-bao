<script>
// ✨ 核心偵錯與所有控制邏輯（加減、送單、計算）全部集中在最頂端，徹底封印手機吃字 Bug！ ✨
window.onerror = function(message, source, lineno, colno, error) {
    alert("捕獲到手機端錯誤: " + message + "\n在 " + source + ":" + lineno);
    return true;
};

var products = {
    bean: { name: '豆沙包', price: 18, count: 0 },
    meat: { name: '肉包', price: 20, count: 0 },
    bamboo: { name: '竹筍包', price: 20, count: 0 },
    brown: { name: '黑糖饅頭', price: 15, count: 0 },
    egg: { name: '饅頭夾蛋', price: 25, count: 0 },
    soy: { name: '豆漿', price: 15, count: 0 },
    milk: { name: '奶茶', price: 20, count: 0 }
};

function changeCount(key, val) {
    if (!products[key]) return;
    var newCount = products[key].count + val;
    if (newCount < 0) newCount = 0;
    products[key].count = newCount;
    document.getElementById('count-' + key).innerText = newCount;
    calculateTotal();
}

function calculateTotal() {
    var total = 0;
    for (var key in products) {
        total += products[key].count * products[key].price;
    }
    document.getElementById('total-amount').innerText = '$ ' + total;
}

function submitOrder() {
    var orderItems = [];
    var total = 0;
    for (var key in products) {
        if (products[key].count > 0) {
            orderItems.push({
                name: products[key].name,
                count: products[key].count,
                subtotal: products[key].count * products[key].price
            });
            total += products[key].count * products[key].price;
        }
    }
    if (orderItems.length === 0) {
        alert("請至少選擇一樣美味的包子或飲料唷！");
        return;
    }
    
    var tips = document.getElementById('no-order-tips');
    if (tips) tips.remove();
    
    var now = new Date();
    var timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0') + ':' + now.getSeconds().toString().padStart(2, '0');
    
    var orderHtml = '<div class="order-card"><div class="order-time">⏱️ 接收時間：' + timeStr + '</div>';
    orderItems.forEach(function(item) {
        orderHtml += '<div class="order-item-detail"><span>' + item.name + ' x ' + item.count + '</span><span>$' + item.subtotal + '</span></div>';
    });
    orderHtml += '<hr style="border: none; border-top: 1px dashed #444; margin: 10px 0;"><div class="order-item-detail" style="font-weight: bold; color: #fbbf24;"><span>實收總計</span><span>$' + total + '</span></div></div>';
    
    document.getElementById('order-container').insertAdjacentHTML('afterbegin', orderHtml);
    
    for (var key in products) {
        products[key].count = 0;
        document.getElementById('count-' + key).innerText = 0;
    }
    calculateTotal();
    alert("🎉 訂單已成功送到下方的老闆後台囉！請往下滑動網頁查看即時接單狀態！");
}
</script>

            letter-spacing: 1px;
        }
        .order-list { padding: 16px; }
        .order-card {

            border-radius: 14px; 
            padding: 16px; 
            margin-bottom: 14px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .order-time { font-size: 12px; color: #737373; margin-bottom: 10px; }
        .order-item-detail { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; color: #e5e5e5; }
    </style>

<body>

            <div class="category-title">🥖 饅頭類</div>
