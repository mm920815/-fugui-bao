<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>富貴包專屬點餐系統</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">

    <!-- 頂部切換按鈕 -->
    <div class="max-w-4xl mx-auto mb-6 flex justify-center gap-4 bg-white p-2 rounded-xl shadow-xs">
        <button onclick="switchView('customer')" id="btn-cust" class="px-6 py-2 rounded-lg font-bold bg-amber-500 text-white shadow-md transition">📱 顧客手機點餐端</button>
        <button onclick="switchView('admin')" id="btn-admin" class="px-6 py-2 rounded-lg font-bold bg-gray-200 text-gray-700 transition">🏪 老闆管理後台</button>
    </div>

    <!-- ==================== 1. 顧客手機點餐端 ==================== -->
    <div id="customer-view" class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-amber-600 p-6 text-white text-center">
            <h1 class="text-3xl font-extrabold tracking-wider">富貴包</h1>
            <p class="text-xs mt-1 opacity-90">手工現做・皮薄餡多・好喫又富貴</p>
        </div>

        <!-- 菜單列表 -->
        <div class="p-4 space-y-4 max-h-[55vh] overflow-y-auto" id="menu-container">
            <!-- 區塊：包子 -->
            <h3 class="font-bold text-gray-800 border-l-4 border-amber-500 pl-2">包子類</h3>
            <div class="space-y-3" id="category-buns"></div>

            <!-- 區塊：饅頭 -->
            <h3 class="font-bold text-gray-800 border-l-4 border-amber-500 pl-2 mt-6">饅頭類</h3>
            <div class="space-y-3" id="category-mantou"></div>

            <!-- 區塊：飲料 -->
            <h3 class="font-bold text-gray-800 border-l-4 border-amber-500 pl-2 mt-6">飲料類</h3>
            <div class="space-y-3" id="category-drinks"></div>
        </div>

        <!-- 購物車與送出區 -->
        <div class="p-4 border-t border-gray-100 bg-gray-50">
            <div class="flex justify-between items-center mb-4">
                <span class="text-gray-600 font-medium">總計金額：</span>
                <span class="text-2xl font-black text-amber-600">$<span id="total-amount">0</span></span>
            </div>
            <button onclick="submitOrder()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-amber-600/20 active:scale-98 transition">
                🚀 送出訂單 / 呼叫後台
            </button>
        </div>
    </div>

    <!-- ==================== 2. 老闆管理後台 ==================== -->
    <div id="admin-view" class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl p-6 hidden">
        <div class="flex justify-between items-center border-b border-gray-100 pb-4 mb-6">
            <div>
                <h2 class="text-2xl font-black text-gray-800">富貴包 雲端接單後台</h2>
                <p class="text-xs text-gray-500 mt-1">即時同步客人的測試訂單</p>
            </div>
            <div class="bg-amber-50 text-amber-700 px-4 py-1.5 rounded-full text-sm font-bold border border-amber-200">營業中</div>
        </div>
