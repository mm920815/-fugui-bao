<script>
window.onerror=function(m,s,l){alert("錯誤:"+m+"\n在"+s+":"+l);return true;};
var products={bean:{name:'豆沙包',price:18,count:0},meat:{name:'肉包',price:20,count:0},bamboo:{name:'竹筍包',price:20,count:0},brown:{name:'黑糖饅頭',price:15,count:0},egg:{name:'饅頭夾蛋',price:25,count:0},soy:{name:'豆漿',price:15,count:0},milk:{name:'奶茶',price:20,count:0}};
function changeCount(k,v){if(!products[k])return;var n=products[k].count+v;if(n<0)n=0;products[k].count=n;document.getElementById('count-'+k).innerText=n;calculateTotal();}
function calculateTotal(){var t=0;for(var k in products){t+=products[k].count*products[k].price;}document.getElementById('total-amount').innerText='$ '+t;}
function submitOrder(){var o=[],t=0;for(var k in products){if(products[k].count>0){o.push({name:products[k].name,count:products[k].count,sub:products[k].count*products[k].price});t+=products[k].count*products[k].price;}}if(o.length===0){alert("請至少選擇一樣美味的商品唷！");return;}var p=document.getElementById('no-order-tips');if(p)p.remove();var n=new Date();var s=n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0')+':'+n.getSeconds().toString().padStart(2,'0');var h='<div class="order-card"><div class="order-time">⏱️ 接收時間：'+s+'</div>';o.forEach(function(i){h+='<div class="order-item-detail"><span>'+i.name+' x '+i.count+'</span><span>$'+i.sub+'</span></div>';});h+='<hr style="border:none;border-top:1px dashed #444;margin:10px 0;"><div class="order-item-detail" style="font-weight:bold;color:#fbbf24;"><span>實收總計</span><span>$'+t+'</span></div></div>';document.getElementById('order-container').insertAdjacentHTML('afterbegin',h);for(var k in products){products[k].count=0;document.getElementById('count-'+k).innerText=0;}calculateTotal();alert("🎉 訂單已成功送到下方的老闆後台！");}
</script>
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>富貴包專屬點餐系統</title>
    <style>
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:0;background-color:#0a0a0a;background-image:radial-gradient(rgba(251,191,36,0.02) 15%,transparent 16%),linear-gradient(45deg,rgba(255,255,255,0.01) 25%,transparent 25%,transparent 75%,rgba(255,255,255,0.01) 75%,rgba(255,255,255,0.01));background-size:50px 50px;background-position:0 0,25px 25px;color:#e5e5e5;display:flex;justify-content:center;}
        .main-container{display:flex;flex-direction:column;width:100%;max-width:650px;padding:16px;gap:24px;box-sizing:border-box;}
        .view-box{background:rgba(22,22,22,0.95);border:1px solid #262626;border-radius:20px;box-shadow:0 15px 35px rgba(0,0,0,0.6);overflow:hidden;display:flex;flex-direction:column;backdrop-filter:blur(10px);}
        .header{background:linear-gradient(135deg,#262626,#171717);border-bottom:1px solid #333;color:#fbbf24;padding:26px 20px;text-align:center;}
        .header h1{margin:0;font-size:24px;letter-spacing:2px;text-shadow:0 2px 10px rgba(251,191,36,0.2);}
        .header p{margin:6px 0 0;font-size:13px;color:#a3a3a3;font-weight:300;}
        .menu-list{padding:8px 16px 20px;}
        .category-title{font-size:16px;color:#fbbf24;border-left:3px solid #fbbf24;padding-left:10px;margin:24px 0 14px;font-weight:bold;letter-spacing:1px;}
        .menu-item{display:flex;justify-content:space-between;align-items:center;padding:16px 4px;border-bottom:1px solid #1f1f1f;}
        .item-info h4{margin:0;font-size:16px;color:#f5f5f5;}
        .item-info p{margin:4px 0 0;font-size:14px;color:#f87171;font-weight:bold;}
        .counter{display:flex;align-items:center;gap:14px;background:#171717;padding:4px 10px;border-radius:20px;border:1px solid #262626;}
        .btn-calc{width:28px;height:28px;border-radius:50%;border:none;background:#262626;color:#fbbf24;font-size:16px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,0.3);-webkit-tap-highlight-color:transparent;}
        .count-num{font-size:16px;font-weight:bold;min-width:20px;text-align:center;color:#ffffff;}
        .footer-bar{padding:20px 16px;background:#121212;border-top:1px solid #262626;}
        .total-price{font-size:18px;font-weight:bold;margin-bottom:16px;display:flex;justify-content:space-between;color:#ffffff;}
        .btn-submit{width:100%;padding:14px;background:linear-gradient(135deg,#f59e0b,#d97706);color:white;border:none;border-radius:25px;font-size:16px;font-weight:bold;cursor:pointer;box-shadow:0 4px 20px rgba(217,119,6,0.4);-webkit-tap-highlight-color:transparent;letter-spacing:1px;}
        .backend-box{display:flex;flex-direction:column;padding-bottom:20px;}
        .status-badge{align-self:center;background:rgba(34,197,94,0.15);color:#4ade80;border:1px solid rgba(34,197,94,0.3);padding:6px 18px;border-radius:20px;font-weight:bold;margin-top:24px;font-size:13px;}
        .order-list{padding:16px;}
        .order-card{background:#171717;border:1px solid #262626;border-radius:14px;padding:16px;margin-bottom:14px;}
        .order-time{font-size:12px;color:#737373;margin-bottom:10px;}
        .order-item-detail{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;color:#e5e5e5;}
    </style>
</head>
<body>
<div class="main-container">
    <div id="customer-view" class="view-box">
        <div class="header">
            <h1>富貴包 點餐系統</h1>
            <p>手工現做・皮薄餡多・好喫又富貴</p>
        </div>
        <div class="menu-list">
            <div class="category-title">🥟 包子類</div>
            <div class="menu-item">
                <div class="item-info"><h4>豆沙包</h4><p>$18</p></div>
                <div class="counter">
                    <button class="btn-calc" onclick="changeCount('bean', -1)">-</button>
                    <span class="count-num" id="count-bean">0</span>
                    <button class="btn-calc" onclick="changeCount('bean', 1)">+</button>
                </div>
            </div>
            <div class="menu-item">
                <div class="item-info"><h4>肉包</h4><p>$20</p></div>
                <div class="counter">
                    <button class="btn-calc" onclick="changeCount('meat', -1)">-</button>
                    <span class="count-num" id="count-meat">0</span>
                    <button class="btn-calc" onclick="changeCount('meat', 1)">+</button>
                </div>
            </div>
            <div class="menu-item">
                <div class="item-info"><h4>竹筍包</h4><p>$20</p></div>
                <div class="counter">
                    <button class="btn-calc" onclick="changeCount('bamboo', -1)">-</button>
                    <span class="count-num" id="count-bamboo">0</span>
                    <button class="btn-calc" onclick="changeCount('bamboo', 1)">+</button>
                </div>
            </div>
            <div class="category-title">🥖 饅頭類</div>
            <div class="menu-item">
                <div class="item-info"><h4>黑糖饅頭</h4><p>$15</p></div>
                <div class="counter">
                    <button class="btn-calc" onclick="changeCount('brown', -1)">-</button>
                    <span class="count-num" id="count-brown">0</span>
                    <button class="btn-calc" onclick="changeCount('brown', 1)">+</button>
                </div>
            </div>
            <div class="menu-item">
                <div class="item-info"><h4>饅頭夾蛋</h4><p>$25</p></div>
                <div class="counter">
                    <button class="btn-calc" onclick="changeCount('egg', -1)">-</button>
                    <span class="count-num" id="count-egg">0</span>
                    <button class="btn-calc" onclick="changeCount('egg', 1)">+</button>
                </div>
            </div>
            <div class="category-title">🥤 飲料類</div>
            <div class="menu-item">
                <div class="item-info"><h4>豆漿</h4><p>$15</p></div>
                <div class="counter">
                    <button class="btn-calc" onclick="changeCount('soy', -1)">-</button>
                    <span class="count-num" id="count-soy">0</span>
                    <button class="btn-calc" onclick="changeCount('soy', 1)">+</button>
                </div>
            </div>
            <div class="menu-item">
                <div class="item-info"><h4>奶茶</h4><p>$20</p></div>
                <div class="counter">
                    <button class="btn-calc" onclick="changeCount('milk', -1)">-</button>
                    <span class="count-num" id="count-milk">0</span>
                    <button class="btn-calc" onclick="changeCount('milk', 1)">+</button>
                </div>
            </div>
        </div>
        <div class="footer-bar">
            <div class="total-price"><span>總計金額：</span><span id="total-amount">$ 0</span></div>
            <button class="btn-submit" onclick="submitOrder()">🚀 送出訂單 / 呼叫後台</button>
        </div>
    </div>
    <div id="backend-view" class="view-box">
        <div class="header"><h1>🏪 雲端接單後台</h1><p>即時同步客人的測試訂單</p></div>
        <div class="backend-box">
            <div class="status-badge">🟢 系統線上營業中</div>
            <div class="order-list" id="order-container">
                <div style="text-align: center; color: #737373; margin-top: 30px; font-size: 14px;" id="no-order-tips">目前暫無測試訂單，請在上方點餐送出</div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
